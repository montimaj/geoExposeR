url: https://envirohealth.code-pages.usgs.gov/geoExposeR/

template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: "geoExposeR: Environmental Exposure Health Modeling"
  description: "An R package for modeling health effects of environmental exposures, featuring data ingestion from GeoTIFF rasters, EPA data processing, multiple imputation for exposure uncertainty, and mixed-effects regression with Rubin's Rules pooling. Applicable to groundwater contaminants (arsenic, nitrate, uranium) and air quality (PM2.5)."
  strip_header: false  # Keep the README header with badges
  
  # Custom sidebar with badges
  sidebar:
    structure: [links, license, community, citation, authors, dev]
    
  links:
  - text: Browse source code
    href: https://code.usgs.gov/envirohealth/geoExposeR
  - text: Report a bug
    href: https://code.usgs.gov/envirohealth/geoExposeR/-/issues

navbar:
  structure:
    left: [home, reference, articles, news]
    right: [search, gitlab]
  components:
    home:
      icon: fas-home
      href: index.html
    reference:
      text: Reference
      href: reference/
    articles:
      text: Articles
      href: articles/
    news:
      text: Changelog
      href: news/
    gitlab:
      icon: fab-gitlab
      href: https://code.usgs.gov/envirohealth/geoExposeR
      aria-label: GitLab

# Configure reference documentation
reference:
  - title: "Main Functions"
    desc: "Core functions for arsenic exposure analysis"
    contents:
    - perform_sensitivity_analysis

  - title: "Data Ingestion"
    desc: "Functions for preparing input data from raw sources"
    contents:
    - prepare_prob_data
    - prepare_conc_data
    - format_health_data
    - add_well_percentages
    - subset_by_geography
    - validate_prepared_inputs

articles:
  - title: "Getting Started"
    navbar: "Getting Started"
    contents:
    - geoExposeR-vignette

authors:
  Sayantan Majumdar:
    href: https://www.dri.edu/directory/sayantan-majumdar/
  Scott M. Bartell:
    href: https://publichealth.uci.edu/faculty/bartell-scott/
  Melissa A. Lombard:
    href: https://www.usgs.gov/staff-profiles/melissa-a-lombard
  Matthew O. Gribble:
    href: https://profiles.ucsf.edu/matthew.gribble
  Ryan G. Smith:
    href: https://www.engr.colostate.edu/ce/ryan-g-smith/

development:
  mode: auto
  version_label: warning
  version_tooltip: "Under development"
