# GitLab CI/CD pipeline for testing gwArsenicR package
# Optimized for faster builds using binary packages

stages:
  - test
  - coverage
  - docs
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  R_KEEP_PKG_SOURCE: "yes"
  # Use RSPM for faster binary package installation
  CRAN_REPO: "https://packagemanager.rstudio.com/cran/__linux__/jammy/latest"
  # Disable package caching to avoid GLIBC conflicts
  R_LIBS_USER: "/tmp/R-libs"

# Base R setup template - optimized for speed
.r_base: &r_base
  before_script:
    # Set up fresh R library directory
    - mkdir -p /tmp/R-libs
    - export R_LIBS_USER="/tmp/R-libs"
    - echo "R_LIBS_USER=$R_LIBS_USER"
    # Configure R for binary packages (much faster)
    - echo 'options(repos = c(CRAN = "https://packagemanager.rstudio.com/cran/__linux__/jammy/latest"))' > ~/.Rprofile
    - echo 'options(HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(), paste(getRversion(), R.version$platform, R.version$arch, R.version$os)))' >> ~/.Rprofile
    - echo 'options(warn = 1, error = traceback)' >> ~/.Rprofile
    - curl -O http://security.ubuntu.com/ubuntu/pool/main/i/icu/libicu70_70.1-2_amd64.deb
    - dpkg -i libicu70_70.1-2_amd64.deb
    # Install basic dependencies quickly
    - R -e "install.packages(c('remotes', 'devtools', 'stringi'), Ncpus = 4)"

# Fast test job template
.test_template: &test_template
  <<: *r_base
  stage: test
  script:
    # Install minimal system dependencies
    - |
      apt-get update && apt-get install -y \
        libcurl4-openssl-dev \
        libssl-dev \
        libxml2-dev \
        pandoc
    # Install all R dependencies quickly using binary packages
    - R -e "install.packages(c('Amelia', 'dplyr', 'lme4', 'broom.mixed', 'mice', 'rms', 'testthat', 'rcmdcheck', 'rmarkdown', 'knitr'))"
    - R -e "remotes::install_deps(dependencies = TRUE)"
    # Quick verification and test
    - |
      R -e "
      # Quick package check
      required_pkgs <- c('Amelia', 'dplyr', 'lme4', 'broom.mixed', 'mice', 'rms', 'testthat', 'devtools')
      missing <- sapply(required_pkgs, function(x) !requireNamespace(x, quietly = TRUE))
      if (any(missing)) {
        cat('Missing packages:', names(missing)[missing], '\n')
        install.packages(names(missing)[missing])
      }
      cat('✅ All packages available\n')
      
      # Load and test
      devtools::document()
      devtools::build()
      devtools::install()
      
      # Run focused test
      if (file.exists('tests/testthat/test-gwArsenic.R')) {
        testthat::test_file('tests/testthat/test-gwArsenic.R', reporter = 'summary')
      } else {
        devtools::test(filter = 'gwArsenic', reporter = 'summary')
      }
      
      cat('✅ Tests completed!\n')
      "
  timeout: 15m  # Much shorter timeout
  artifacts:
    when: on_failure
    paths:
      - check/
    expire_in: 1 week
  only:
    refs:
      - main
      - develop
      - merge_requests
    changes:
      - "**/*.R"
      - "DESCRIPTION"
      - "tests/**/*"
      - ".gitlab-ci.yml"

# Test jobs for different R versions - optimized
test:r-release-ubuntu:
  <<: *test_template
  image: rocker/r-ver:latest
  variables:
    R_VERSION: "release"
    PLATFORM: "ubuntu-latest"

# Simplified coverage job
coverage:
  <<: *r_base
  stage: coverage
  image: rocker/r-ver:latest
  script:
    # Minimal system dependencies
    - apt-get update && apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
    # Fast binary package installation
    - R -e "install.packages(c('Amelia', 'dplyr', 'lme4', 'broom.mixed', 'mice', 'rms', 'covr', 'testthat', 'devtools', 'stringi'), Ncpus = 4)"
    - R -e "remotes::install_deps(dependencies = TRUE)"
    # Quick coverage
    - |
      R -e "
      devtools::document()
      devtools::build()
      devtools::install()
      
      # Generate coverage
      cov <- covr::package_coverage(
        path = 'R/gwArsenic.R',
        test_files = 'tests/testthat/test-gwArsenic.R',
        quiet = TRUE
      )
      
      coverage_pct <- covr::percent_coverage(cov)
      cat(sprintf('Coverage: %.1f%%\n', coverage_pct))
      
      # Save results
      dir.create('coverage', showWarnings = FALSE)
      writeLines(
        paste('Coverage:', sprintf('%.1f%%', coverage_pct)),
        'coverage/coverage-summary.txt'
      )
      
      # Quality gate
      if (coverage_pct < 65) {
        quit(status = 1)
      }
      "
  timeout: 10m
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week
  coverage: '/Coverage: \d+\.\d+%/'
  only:
    refs:
      - main
    changes:
      - "**/*.R"
      - "tests/**/*"
      - ".gitlab-ci.yml"

# Simplified docs job
docs:
  <<: *r_base
  stage: docs
  image: rocker/r-ver:latest
  script:
    - apt-get update && apt-get install -y libcurl4-openssl-dev libssl-dev
    - R -e "install.packages(c('roxygen2', 'devtools'), Ncpus = 4)"
    - R -e "remotes::install_deps(dependencies = TRUE)"
    - R -e "devtools::document()"
  timeout: 8m
  only:
    refs:
      - main
      - develop
      - merge_requests
    changes:
      - "R/**/*"
      - "DESCRIPTION"

# Simplified pages job
pages:
  <<: *r_base
  stage: deploy
  image: rocker/r-ver:latest
  script:
    - apt-get update && apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
    - R -e "install.packages(c('pkgdown', 'devtools', 'rmarkdown', 'knitr'), Ncpus = 4)"
    - R -e "remotes::install_deps(dependencies = TRUE)"
    - R -e "pkgdown::build_site(dest_dir = 'public', new_process = FALSE)"
  timeout: 15m
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    refs:
      - main

# macOS test - keep as is since it's already fast
test:r-release-macos:
  <<: *r_base
  stage: test
  tags:
    - macos
  script:
    - brew install pandoc || true
    - R -e "install.packages(c('Amelia', 'dplyr', 'lme4', 'broom.mixed', 'mice', 'rms', 'testthat', 'devtools'))"
    - R -e "remotes::install_deps(dependencies = TRUE)"
    - |
      R -e "
      devtools::load_all()
      if (file.exists('tests/testthat/test-gwArsenic.R')) {
        testthat::test_file('tests/testthat/test-gwArsenic.R', reporter = 'summary')
      }
      "
  timeout: 15m
  allow_failure: true
  only:
    refs:
      - main
      - merge_requests
    changes:
      - "**/*.R"
      - "DESCRIPTION"
      - "tests/**/*"
      - ".gitlab-ci.yml"

# Optional: Keep only one Ubuntu test job to save resources
# Remove or comment out these if you want to save more time:
# test:r-devel-ubuntu:
#   <<: *test_template
#   image: rocker/r-devel:latest
#   allow_failure: true

# test:r-oldrel-ubuntu:
#   <<: *test_template  
#   image: rocker/r-ver:4.4.0
#   allow_failure: true

# Fast release job
release:
  <<: *r_base
  stage: deploy
  image: rocker/r-ver:latest
  script:
    - R -e "install.packages(c('devtools', 'pkgbuild'), Ncpus = 4)"
    - R -e "remotes::install_deps(dependencies = TRUE)"
    - R -e "devtools::build()"
  artifacts:
    paths:
      - "*.tar.gz"
    expire_in: 1 year
  only:
    - tags
  except:
    - branches