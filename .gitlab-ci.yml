# GitLab CI/CD pipeline for testing gwArsenicR package
# This pipeline tests the package on multiple R versions and operating systems
# to ensure compatibility and reliability across different environments

stages:
  - test
  - coverage
  - docs
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  R_KEEP_PKG_SOURCE: "yes"
  CRAN_REPO: "https://cloud.r-project.org/"

# Cache definition for R packages
.r_cache: &r_cache
  cache:
    key: "r-packages-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/R/
      - renv/
    policy: pull-push

# Base R setup template
.r_base: &r_base
  before_script:
    # Set up R library cache directory
    - mkdir -p .cache/R
    - export R_LIBS_USER="$(pwd)/.cache/R"
    - echo "R_LIBS_USER=$R_LIBS_USER"
    # Update package repositories
    - echo 'options(repos = c(CRAN = Sys.getenv("CRAN_REPO", "https://cloud.r-project.org/")))' > ~/.Rprofile
    - echo 'options(warn = 2, error = traceback)' >> ~/.Rprofile
    # Install basic dependencies
    - R -e "if (!requireNamespace('remotes', quietly = TRUE)) install.packages('remotes')"
    - R -e "if (!requireNamespace('devtools', quietly = TRUE)) install.packages('devtools')"

# Test job template
.test_template: &test_template
  <<: *r_base
  <<: *r_cache
  stage: test
  script:
    # Install system dependencies for Linux
    - |
      if [ "$CI_RUNNER_EXECUTABLE_ARCH" = "linux/amd64" ] || [ "$CI_RUNNER_EXECUTABLE_ARCH" = "linux/arm64" ]; then
        apt-get update && apt-get install -y \
          libcurl4-openssl-dev \
          libssl-dev \
          libxml2-dev \
          pandoc \
          libfontconfig1-dev \
          libfreetype6-dev \
          libpng-dev \
          libtiff5-dev \
          libjpeg-dev \
          libharfbuzz-dev \
          libfribidi-dev \
          pkg-config
      fi
    # Install package dependencies explicitly
    - R -e "install.packages(c('Amelia', 'dplyr', 'lme4', 'broom.mixed', 'mice', 'rms'), repos = 'https://cloud.r-project.org/')"
    - R -e "remotes::install_deps(dependencies = TRUE, upgrade = 'always')"
    - R -e "install.packages(c('testthat', 'rcmdcheck', 'covr', 'spelling'))"
    # Ensure devtools is available (redundant check for safety)
    - R -e "if (!requireNamespace('devtools', quietly = TRUE)) install.packages('devtools')"
    # Check package build
    - mkdir -p check
    - R -e "result <- rcmdcheck::rcmdcheck(args = '--no-manual', error_on = 'error'); if (length(result\$errors) > 0 || length(result\$warnings) > 0) { dir.create('check', showWarnings = FALSE); writeLines(c(result\$errors, result\$warnings), 'check/rcmdcheck_output.txt') }"
    # Run comprehensive tests
    - |
      R -e "
      options(warn = 2, error = traceback)
      
      # Ensure devtools is loaded
      if (!requireNamespace('devtools', quietly = TRUE)) {
        install.packages('devtools')
      }
      library(devtools)
      
      devtools::load_all()
      
      tryCatch({
        cat('Running test-gwArsenic.R specifically...\n')
        if (file.exists('tests/testthat/test-gwArsenic.R')) {
          testthat::test_file('tests/testthat/test-gwArsenic.R', reporter = 'summary')
          cat('test-gwArsenic.R completed successfully!\n')
        } else {
          cat('Warning: test-gwArsenic.R not found, trying filter approach...\n')
          devtools::test(filter = 'gwArsenic', reporter = 'summary')
        }
        
        cat('Running full test suite...\n')
        devtools::test(reporter = 'summary')
        
        cat('Testing package installation...\n')
        devtools::install(quiet = FALSE)
        library(gwArsenicR)
        
        # Test main function exists
        stopifnot(exists('perform_sensitivity_analysis'))
        cat('All tests completed successfully!\n')
      }, error = function(e) {
        cat('Test failed with error:\n')
        print(e)
        quit(status = 1)
      })
      "
    # Test vignette rendering
    - |
      R -e "
      if (file.exists('vignettes/gwArsenicR-vignette.Rmd')) {
        cat('Testing vignette rendering...\n')
        tryCatch({
          rmarkdown::render('vignettes/gwArsenicR-vignette.Rmd', 
                          output_dir = tempdir())
          cat('Vignette rendered successfully!\n')
        }, error = function(e) {
          cat('Vignette rendering failed:\n')
          print(e)
          quit(status = 1)
        })
      }
      "
    # Show session info
    - |
      R -e "
      options(width = 100)
      pkgs <- installed.packages()[, 'Package']
      sessioninfo::session_info(pkgs, include_base = TRUE)
      "
  artifacts:
    when: on_failure
    paths:
      - check/
      - "*.Rcheck/"
    expire_in: 1 week
  after_script:
    # Ensure check directory exists for artifact collection
    - mkdir -p check
    - if [ -d "*.Rcheck" ]; then cp -r *.Rcheck/* check/ 2>/dev/null || true; fi
  only:
    refs:
      - main
      - develop
      - merge_requests
    changes:
      - "**/*.R"
      - "**/*.Rmd"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "tests/**/*"
      - ".gitlab-ci.yml"

# Test jobs for different R versions and platforms
test:r-release-ubuntu:
  <<: *test_template
  image: rocker/r-ver:latest
  variables:
    R_VERSION: "release"
    PLATFORM: "ubuntu-latest"

test:r-devel-ubuntu:
  <<: *test_template
  image: rocker/r-devel:latest
  variables:
    R_VERSION: "devel"
    PLATFORM: "ubuntu-latest"
  allow_failure: false

test:r-oldrel-ubuntu:
  <<: *test_template
  image: rocker/r-ver:4.4.0  # Updated to meet R >= 4.4.0 requirement
  variables:
    R_VERSION: "4.4.0"
    PLATFORM: "ubuntu-latest"

# macOS test jobs
test:r-release-macos:
  <<: *r_base
  <<: *r_cache
  stage: test
  tags:
    - macos
  script:
    # Check R version and update if needed
    - |
      echo "Current R version:"
      R --version
      # Ensure we're using a compatible R version
      if command -v brew >/dev/null 2>&1; then
        echo "Updating R via Homebrew..."
        brew install --cask r || brew upgrade --cask r || true
      fi
    # Install system dependencies for macOS
    - brew install pandoc || true
    # Set R options to handle warnings as errors properly
    - |
      R -e "
      options(warn = 1)  # Don't convert warnings to errors for package installation
      cat('R version:', R.version.string, '\n')
      cat('Platform:', R.version\$platform, '\n')
      "
    # Install package dependencies with better error handling
    - |
      R -e "
      options(warn = 1)  # Warnings as warnings, not errors
      cat('Installing remotes and dependencies...\n')
      if (!requireNamespace('remotes', quietly = TRUE)) {
        install.packages('remotes', repos = 'https://cloud.r-project.org/')
      }
      remotes::install_deps(dependencies = TRUE, upgrade = 'always')
      "
    # Install test dependencies
    - |
      R -e "
      options(warn = 1)
      cat('Installing test dependencies...\n')
      pkgs_to_install <- c('testthat', 'rcmdcheck', 'covr', 'spelling')
      for (pkg in pkgs_to_install) {
        if (!requireNamespace(pkg, quietly = TRUE)) {
          cat('Installing', pkg, '...\n')
          install.packages(pkg, repos = 'https://cloud.r-project.org/')
        } else {
          cat(pkg, 'already installed\n')
        }
      }
      cat('All test dependencies installed successfully\n')
      "
    # Check package build
    - mkdir -p check
    - |
      R -e "
      options(warn = 1)  # Don't treat warnings as errors for rcmdcheck
      cat('Running R CMD check...\n')
      result <- rcmdcheck::rcmdcheck(args = '--no-manual', error_on = 'error')
      if (length(result\$errors) > 0 || length(result\$warnings) > 0) { 
        dir.create('check', showWarnings = FALSE)
        writeLines(c(result\$errors, result\$warnings), 'check/rcmdcheck_output.txt')
      }
      cat('R CMD check completed\n')
      "
    # Run comprehensive tests with better error handling
    - |
      R -e "
      options(warn = 1)  # Keep warnings as warnings during testing
      cat('Loading package...\n')
      devtools::load_all()
      
      tryCatch({
        cat('Running test-gwArsenic.R specifically...\n')
        if (file.exists('tests/testthat/test-gwArsenic.R')) {
          testthat::test_file('tests/testthat/test-gwArsenic.R', reporter = 'summary')
          cat('test-gwArsenic.R completed successfully!\n')
        } else {
          cat('Warning: test-gwArsenic.R not found, trying filter approach...\n')
          devtools::test(filter = 'gwArsenic', reporter = 'summary')
        }
        
        cat('Running full test suite...\n')
        # Suppress package version warnings during testing
        suppressWarnings(devtools::test(reporter = 'summary'))
        
        cat('Testing package installation...\n')
        devtools::install(quiet = FALSE)
        library(gwArsenicR)
        
        # Test main function exists
        stopifnot(exists('perform_sensitivity_analysis'))
        cat('All tests completed successfully!\n')
      }, error = function(e) {
        cat('Test failed with error:\n')
        print(e)
        quit(status = 1)
      })
      "
    # Test vignette rendering
    - |
      R -e "
      options(warn = 1)
      if (file.exists('vignettes/gwArsenicR-vignette.Rmd')) {
        cat('Testing vignette rendering...\n')
        tryCatch({
          suppressWarnings(
            rmarkdown::render('vignettes/gwArsenicR-vignette.Rmd', 
                            output_dir = tempdir())
          )
          cat('Vignette rendered successfully!\n')
        }, error = function(e) {
          cat('Vignette rendering failed:\n')
          print(e)
          quit(status = 1)
        })
      }
      "
    # Show session info
    - |
      R -e "
      options(width = 100, warn = 1)
      cat('=== Session Information ===\n')
      cat('R version:', R.version.string, '\n')
      cat('Platform:', R.version\$platform, '\n')
      pkgs <- installed.packages()[, 'Package']
      suppressWarnings(sessioninfo::session_info(pkgs, include_base = TRUE))
      "
  variables:
    R_VERSION: "release"
    PLATFORM: "macos-latest"
  artifacts:
    when: on_failure
    paths:
      - check/
    expire_in: 1 week
  allow_failure: false
  only:
    refs:
      - main
      - develop
      - merge_requests
    changes:
      - "**/*.R"
      - "**/*.Rmd"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "tests/**/*"
      - ".gitlab-ci.yml"

# Coverage job
coverage:
  <<: *r_base
  <<: *r_cache
  stage: coverage
  image: rocker/r-ver:latest
  script:
    # Install system dependencies for fonts and graphics
    - |
      apt-get update && apt-get install -y \
        libfontconfig1-dev \
        libfreetype6-dev \
        libpng-dev \
        libtiff5-dev \
        libjpeg-dev \
        libharfbuzz-dev \
        libfribidi-dev \
        pkg-config
    # Install package dependencies explicitly
    - R -e "install.packages(c('Amelia', 'dplyr', 'lme4', 'broom.mixed', 'mice', 'rms'), repos = 'https://cloud.r-project.org/')"
    - R -e "remotes::install_deps(dependencies = TRUE, upgrade = 'always')"
    - R -e "install.packages(c('covr', 'testthat', 'devtools', 'DT', 'htmltools'))"
    # Generate coverage report
    - |
      R -e "
      options(repos = c(CRAN = 'https://cloud.r-project.org/'))
      
      devtools::load_all('.', quiet = FALSE)
      
      cat('Generating coverage for gwArsenic.R...\n')
      start_time <- Sys.time()
      
      # Generate coverage specifically for gwArsenic.R
      full_cov <- covr::package_coverage(
        path = 'R/gwArsenic.R',
        test_files = 'tests/testthat/test-gwArsenic.R',
        quiet = FALSE,
        clean = FALSE,
        type = 'tests'
      )
      
      end_time <- Sys.time()
      cat('✅ Coverage generation completed in',
          round(as.numeric(end_time - start_time, units = 'secs'), 2),
          'seconds\n\n')
      
      # Create coverage directory
      dir.create('coverage', showWarnings = FALSE)
      
      # Generate HTML report for gwArsenic.R only
      cat('\n=== Generating gwArsenic.R Coverage Report ===\n')
      tryCatch({
        # Filter coverage to show only gwArsenic.R
        gwarsenic_only_cov <- Filter(function(x) {
          if (is.list(x) && !is.null(x\$srcref)) {
            srcfile_name <- attr(x\$srcref, 'srcfile')\$filename
            grepl('gwArsenic\\\\.R', basename(srcfile_name), ignore.case = TRUE)
          } else {
            FALSE
          }
        }, full_cov)
        
        # Recreate coverage object with proper class and attributes
        if (length(gwarsenic_only_cov) > 0) {
          class(gwarsenic_only_cov) <- class(full_cov)
          attr(gwarsenic_only_cov, 'package') <- attr(full_cov, 'package')
          attr(gwarsenic_only_cov, 'relative') <- attr(full_cov, 'relative')
          
          # Generate report with filtered coverage
          covr::report(gwarsenic_only_cov, file = 'coverage/gwArsenic-coverage.html')
          cat('✅ HTML coverage report generated for gwArsenic.R only\n')
        } else {
          cat('⚠️ No gwArsenic.R coverage found, generating full report\n')
          covr::report(full_cov, file = 'coverage/gwArsenic-coverage.html')
        }
      }, error = function(e) {
        cat('⚠️ Warning: Could not generate HTML report:\n')
        print(e)
        cat('Trying fallback approach...\n')
        tryCatch({
          covr::report(full_cov, file = 'coverage/gwArsenic-coverage.html')
          cat('✅ Fallback HTML report generated\n')
        }, error = function(e2) {
          cat('❌ Could not generate any HTML report\n')
        })
      })
      
      # Create a focused summary file
      coverage_pct <- covr::percent_coverage(gwarsenic_only_cov)
      cat(sprintf('📊 gwArsenic.R Coverage: %.1f%%\n\n', coverage_pct))
      total_lines <- length(full_cov)
      uncovered_lines <- ceiling(
        total_lines - coverage_pct / 100 * total_lines
      )
      coverage_summary <- data.frame(
        File = 'gwArsenic.R',
        Coverage = sprintf('%.1f%%', coverage_pct),
        Status = if (coverage_pct >= 85) {
          '✅ EXCELLENT'
        } else if (coverage_pct >= 75) {
          '✅ GOOD'
        } else if (coverage_pct >= 65) {
          '⚠️ NEEDS IMPROVEMENT'
        } else {
          '❌ INSUFFICIENT'
        },
        Target = '≥85%',
        Uncovered_Lines = uncovered_lines,
        Total_Lines = total_lines,
        stringsAsFactors = FALSE
      )
      cat('\n=== gwArsenic.R Coverage Summary ===\n')
      print(coverage_summary)
      write.csv(coverage_summary, 'coverage/gwArsenic-coverage-summary.csv', row.names = FALSE)

      # Set quality gates
      cat('\n=== Quality Gate Assessment ===\n')
      if (coverage_pct < 65) {
        cat(sprintf('❌ FAIL: gwArsenic.R coverage %.1f%% is below minimum threshold (65%%)\n', coverage_pct))
        cat('🔧 Recommendation: Add more comprehensive tests\n')
        quit(status = 1)
      } else if (coverage_pct < 75) {
        cat(sprintf('⚠️ WARNING: gwArsenic.R coverage %.1f%% is below recommended threshold (75%%)\n', coverage_pct))
        cat('🔧 Recommendation: Consider adding tests for edge cases\n')
      } else {
        cat(sprintf('✅ SUCCESS: gwArsenic.R coverage %.1f%% meets quality standards\n', coverage_pct))
      }
      
      # Additional recommendations
      if (coverage_pct < 85) {
        cat('\n📝 Suggestions to improve coverage:\n')
        cat('1. Add tests for error conditions and edge cases\n')
        cat('2. Test all branches of conditional statements\n')
        cat('3. Ensure all validation functions are tested\n')
        cat('4. Test both success and failure scenarios\n')
      }
      
      # Generate coverage badge data
      if (coverage_pct >= 90) {
        color <- 'brightgreen'
      } else if (coverage_pct >= 80) {
        color <- 'green' 
      } else if (coverage_pct >= 70) {
        color <- 'yellow'
      } else if (coverage_pct >= 60) {
        color <- 'orange'
      } else {
        color <- 'red'
      }
      
      badge_url <- sprintf('https://img.shields.io/badge/coverage-%.1f%%%%25-%s.svg', 
                          coverage_pct, color)
      
      # Write badge info to file for potential README updates
      writeLines(c(
        paste('COVERAGE_PCT=', coverage_pct, sep=''),
        paste('COVERAGE_BADGE=', badge_url, sep='')
      ), 'coverage/badge-info.txt')
      
      cat(sprintf('Generated coverage badge: %s\n', badge_url))
      "
  artifacts:
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/coverage.xml
    expire_in: 1 week
  coverage: '/Coverage: \d+\.\d+%/'
  only:
    refs:
      - main
    changes:
      - "**/*.R"
      - "tests/**/*"
      - ".gitlab-ci.yml"

# Documentation validation
docs:
  <<: *r_base
  <<: *r_cache
  stage: docs
  image: rocker/r-ver:latest
  script:
    # Install dependencies
    - R -e "remotes::install_deps(dependencies = TRUE, upgrade = 'always')"
    - R -e "install.packages(c('roxygen2', 'devtools', 'pkgdown'))"
    # Check documentation
    - |
      R -e "
      cat('Generating documentation...\n')
      devtools::document()
      
      # Verify no uncommitted changes to documentation
      status_output <- system('git status --porcelain', intern = TRUE)
      if (length(status_output) > 0) {
        cat('Documentation is out of date. Please run devtools::document()\n')
        cat('Changed files:\n')
        system('git status')
        system('git diff')
        quit(status = 1)
      }
      
      cat('Documentation is up to date!\n')
      "
  only:
    refs:
      - main
      - develop
      - merge_requests
    changes:
      - "R/**/*"
      - "man/**/*"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".gitlab-ci.yml"

# pkgdown site generation and deployment
pages:
  <<: *r_base
  <<: *r_cache
  stage: deploy
  image: rocker/r-ver:latest
  script:
    # Install dependencies
    - R -e "remotes::install_deps(dependencies = TRUE, upgrade = 'always')"
    - R -e "install.packages(c('pkgdown', 'devtools'))"
    # Clean and build pkgdown site
    - |
      R -e "
      # Force clean any existing pkgdown artifacts
      pkgdown::clean_site(force = TRUE)
      # Build site for GitLab Pages
      pkgdown::build_site(dest_dir = 'public', new_process = FALSE, install = FALSE)
      "
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    refs:
      - main
  needs:
    - job: test:r-release-ubuntu
      optional: true
    - job: docs
      optional: true

# Release job (optional - runs on tags)
release:
  <<: *r_base
  stage: deploy
  image: rocker/r-ver:latest
  script:
    # Install dependencies
    - R -e "remotes::install_deps(dependencies = TRUE, upgrade = 'always')"
    - R -e "install.packages(c('devtools', 'pkgbuild'))"
    # Build package
    - R -e "devtools::build()"
    # Create source package
    - R -e "pkgbuild::build(dest_path = '.', binary = FALSE)"
  artifacts:
    paths:
      - "*.tar.gz"
    expire_in: 1 year
  only:
    - tags
  except:
    - branches

# Security scan (optional)
security_scan:
  stage: test
  image: rocker/r-ver:latest
  script:
    - R -e "if (!requireNamespace('oysteR', quietly = TRUE)) install.packages('oysteR')"
    - R -e "oysteR::audit_installed_r_pkgs()"
  allow_failure: true
  only:
    refs:
      - main
      - develop
    changes:
      - "DESCRIPTION"
      - ".gitlab-ci.yml"
