# GitLab CI/CD pipeline for geoExposeR R package
# Optimized for USGS GitLab with pkgdown site deployment

stages:
  - test
  - coverage
  - docs
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  R_KEEP_PKG_SOURCE: "yes"
  R_LIBS_USER: "/tmp/R-libs"

# Base R setup template
.r_base: &r_base
  before_script:
    - mkdir -p /tmp/R-libs
    - export R_LIBS_USER="/tmp/R-libs"
    - R -e "cat('R version:', as.character(getRversion()), '\n')"
    - R -e "install.packages(c('remotes', 'devtools'), Ncpus = 4)"

# Test job template
.test_template: &test_template
  <<: *r_base
  stage: test
  script:
    - R -e "install.packages(c('data.table', 'dplyr', 'Hmisc', 'lme4', 'broom.mixed', 'mice', 'rlang', 'testthat', 'rcmdcheck', 'rmarkdown', 'knitr'), Ncpus = 4)"
    - R -e "remotes::install_deps(dependencies = TRUE)"
    - R -e "devtools::load_all(); devtools::test()"
  timeout: 45m
  artifacts:
    when: on_failure
    paths:
      - check/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# Test job - R release only (package requires R >= 4.4.0)
test:r-release:
  <<: *test_template
  image: rocker/geospatial:latest

# Coverage job
coverage:
  <<: *r_base
  stage: coverage
  image: rocker/geospatial:latest
  script:
    - mkdir -p coverage
    - R -e "install.packages(c('devtools', 'covr', 'testthat', 'DT', 'htmltools'), Ncpus = 4)"
    - R -e "install.packages(c('data.table', 'dplyr', 'Hmisc', 'lme4', 'broom.mixed', 'mice', 'rlang'), Ncpus = 4)"
    - R -e "remotes::install_deps(dependencies = TRUE)"
    - |
      R -e '
      library(devtools)
      library(covr)
      
      cat("=== Coverage Testing for geoExposeR ===\n")
      
      # Generate coverage
      devtools::load_all()
      cov <- covr::package_coverage()
      
      # Calculate coverage percentage
      coverage_pct <- covr::percent_coverage(cov)
      cat(sprintf("Coverage: %.1f%%\n", coverage_pct))
      
      # Generate reports
      dir.create("coverage", showWarnings = FALSE)
      covr::report(cov, file = "coverage/coverage-report.html")
      
      # Write summary
      writeLines(
        c(
          paste("Coverage:", sprintf("%.1f%%", coverage_pct)),
          paste("Date:", Sys.Date())
        ),
        "coverage/coverage-summary.txt"
      )
      
      # Quality gate
      if (coverage_pct < 65) {
        cat("FAIL: Coverage below 65%\n")
        quit(status = 1)
      } else {
        cat("SUCCESS: Coverage meets threshold\n")
      }
      '
  timeout: 45m
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week
  coverage: '/Coverage: (\d+\.\d+)%/'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Documentation generation
docs:
  <<: *r_base
  stage: docs
  image: rocker/geospatial:latest
  script:
    - R -e "install.packages(c('roxygen2', 'devtools'), Ncpus = 4)"
    - R -e "remotes::install_deps(dependencies = TRUE)"
    - R -e "devtools::document()"
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# GitLab Pages deployment
pages:
  <<: *r_base
  stage: deploy
  image: rocker/geospatial:latest
  script:
    - apt-get update && apt-get install -qq -y texlive-latex-base texlive-fonts-recommended texlive-latex-extra
    - R -e "install.packages(c('pkgdown', 'devtools', 'rmarkdown', 'knitr', 'markdown', 'htmltools'), Ncpus = 4)"
    - R -e "install.packages(c('data.table', 'dplyr', 'Hmisc', 'lme4', 'broom.mixed', 'mice', 'rlang'), Ncpus = 4)"
    - R -e "remotes::install_deps(dependencies = TRUE)"
    - R -e "pkgdown::build_site()"
    - mv docs public
  timeout: 60m
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
