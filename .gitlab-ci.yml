# GitLab CI/CD pipeline for gwArsenicR R package
# Optimized for USGS GitLab with pkgdown site deployment

stages:
  - test
  - coverage
  - docs
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  R_KEEP_PKG_SOURCE: "yes"
  R_LIBS_USER: "/tmp/R-libs"

# Base R setup template
.r_base: &r_base
  before_script:
    - mkdir -p /tmp/R-libs
    - export R_LIBS_USER="/tmp/R-libs"
    - echo 'options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/jammy/latest"))' > ~/.Rprofile
    - echo 'options(HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(), paste(getRversion(), R.version$platform, R.version$arch, R.version$os)))' >> ~/.Rprofile
    - echo 'options(warn = 1)' >> ~/.Rprofile
    - R -e "install.packages(c('remotes', 'devtools'), quiet = TRUE)"

# Test job template
.test_template: &test_template
  <<: *r_base
  stage: test
  script:
    - apt-get update && apt-get install -qq -y libcurl4-openssl-dev libssl-dev libxml2-dev build-essential pandoc libgdal-dev libgeos-dev libproj-dev libudunits2-dev
    - R -e "install.packages(c('Amelia', 'data.table', 'dplyr', 'exactextractr', 'Hmisc', 'lme4', 'broom.mixed', 'mice', 'rlang', 'rms', 'sf', 'terra', 'testthat', 'rcmdcheck', 'rmarkdown', 'knitr'), Ncpus = 4, quiet = TRUE)"
    - R -e "remotes::install_deps(dependencies = TRUE)"
    - R -e "devtools::load_all(); devtools::test()"
  timeout: 20m
  artifacts:
    when: on_failure
    paths:
      - check/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# Test jobs for different R versions
# Note: Package requires R >= 4.4.0 (see DESCRIPTION)
test:r-release:
  <<: *test_template
  image: rocker/r-ver:latest

test:r-4.4:
  <<: *test_template
  image: rocker/r-ver:4.4.2

# Coverage job
coverage:
  <<: *r_base
  stage: coverage
  image: rocker/r-ver:latest
  script:
    - mkdir -p coverage
    - apt-get update && apt-get install -qq -y libcurl4-openssl-dev libssl-dev libxml2-dev libicu-dev gfortran build-essential libgdal-dev libgeos-dev libproj-dev libudunits2-dev
    - R -e "install.packages(c('devtools', 'covr', 'testthat', 'DT', 'htmltools'), quiet = TRUE)"
    - R -e "install.packages(c('Amelia', 'data.table', 'dplyr', 'exactextractr', 'Hmisc', 'lme4', 'broom.mixed', 'mice', 'rlang', 'rms', 'sf', 'terra'), quiet = TRUE)"
    - R -e "remotes::install_deps(dependencies = TRUE)"
    - |
      R -e '
      library(devtools)
      library(covr)
      
      cat("=== Coverage Testing for gwArsenicR ===\n")
      
      # Generate coverage
      devtools::load_all()
      cov <- covr::package_coverage()
      
      # Calculate coverage percentage
      coverage_pct <- covr::percent_coverage(cov)
      cat(sprintf("Coverage: %.1f%%\n", coverage_pct))
      
      # Generate reports
      dir.create("coverage", showWarnings = FALSE)
      covr::report(cov, file = "coverage/coverage-report.html")
      
      # Write summary
      writeLines(
        c(
          paste("Coverage:", sprintf("%.1f%%", coverage_pct)),
          paste("Date:", Sys.Date())
        ),
        "coverage/coverage-summary.txt"
      )
      
      # Quality gate
      if (coverage_pct < 65) {
        cat("FAIL: Coverage below 65%\n")
        quit(status = 1)
      } else {
        cat("SUCCESS: Coverage meets threshold\n")
      }
      '
  timeout: 25m
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week
  coverage: '/Coverage: (\d+\.\d+)%/'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Documentation generation
docs:
  <<: *r_base
  stage: docs
  image: rocker/r-ver:latest
  script:
    - apt-get update && apt-get install -y libcurl4-openssl-dev libssl-dev build-essential pandoc libgdal-dev libgeos-dev libproj-dev libudunits2-dev
    - R -e "install.packages(c('roxygen2', 'devtools'), quiet = TRUE)"
    - R -e "remotes::install_deps(dependencies = TRUE)"
    - R -e "devtools::document()"
  timeout: 10m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# GitLab Pages deployment
pages:
  <<: *r_base
  stage: deploy
  image: rocker/r-ver:latest
  script:
    - apt-get update && apt-get install -qq -y libcurl4-openssl-dev libssl-dev libxml2-dev libicu-dev gfortran build-essential pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-extra libtiff5-dev libpng-dev libjpeg-dev libgdal-dev libgeos-dev libproj-dev libudunits2-dev
    - R -e "install.packages(c('pkgdown', 'devtools', 'rmarkdown', 'knitr', 'markdown', 'htmltools'), quiet = TRUE)"
    - R -e "install.packages(c('Amelia', 'data.table', 'dplyr', 'exactextractr', 'Hmisc', 'lme4', 'broom.mixed', 'mice', 'rlang', 'rms', 'sf', 'terra'), quiet = TRUE)"
    - R -e "remotes::install_deps(dependencies = TRUE)"
    - R -e "pkgdown::build_site()"
    - mv docs public
  timeout: 30m
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
