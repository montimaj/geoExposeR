# GitLab CI/CD pipeline for testing gwArsenicR package
# This pipeline tests the package on multiple R versions and operating systems
# to ensure compatibility and reliability across different environments

stages:
  - test
  - coverage
  - docs
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  R_KEEP_PKG_SOURCE: "yes"
  CRAN_REPO: "https://cloud.r-project.org/"

# Cache definition for R packages
.r_cache: &r_cache
  cache:
    key: "r-packages-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/R/
      - renv/
    policy: pull-push

# Base R setup template
.r_base: &r_base
  before_script:
    # Set up R library cache directory
    - mkdir -p .cache/R
    - export R_LIBS_USER="$(pwd)/.cache/R"
    - echo "R_LIBS_USER=$R_LIBS_USER"
    # Update package repositories
    - echo 'options(repos = c(CRAN = Sys.getenv("CRAN_REPO", "https://cloud.r-project.org/")))' > ~/.Rprofile
    - echo 'options(warn = 2, error = traceback)' >> ~/.Rprofile
    # Install basic dependencies
    - R -e "if (!requireNamespace('remotes', quietly = TRUE)) install.packages('remotes')"
    - R -e "if (!requireNamespace('devtools', quietly = TRUE)) install.packages('devtools')"

# Test job template
.test_template: &test_template
  <<: *r_base
  <<: *r_cache
  stage: test
  script:
    # Install system dependencies for Linux
    - |
      if [ "$CI_RUNNER_EXECUTABLE_ARCH" = "linux/amd64" ] || [ "$CI_RUNNER_EXECUTABLE_ARCH" = "linux/arm64" ]; then
        apt-get update && apt-get install -y \
          libcurl4-openssl-dev \
          libssl-dev \
          libxml2-dev \
          pandoc \
          libfontconfig1-dev \
          libfreetype6-dev \
          libharfbuzz-dev \
          libfribidi-dev \
          pkg-config \
          libpng-dev \
          libtiff5-dev \
          libjpeg-dev \
          cmake \
          build-essential
      fi
    # Install dependencies efficiently
    - R -e "install.packages(c('Amelia', 'dplyr', 'lme4', 'broom.mixed', 'mice', 'rms', 'testthat', 'rcmdcheck'), repos = 'https://cloud.r-project.org/', Ncpus = 2)"
    - R -e "remotes::install_deps(dependencies = TRUE)"
    # Run tests
    - |
      R -e "
      options(warn = 1)
      devtools::load_all()
      
      # Run focused test
      if (file.exists('tests/testthat/test-gwArsenic.R')) {
        testthat::test_file('tests/testthat/test-gwArsenic.R', reporter = 'summary')
      } else {
        devtools::test(filter = 'gwArsenic', reporter = 'summary')
      }
      
      cat('✅ Tests completed!\n')
      "
  timeout: 30m
  artifacts:
    when: on_failure
    paths:
      - check/
    expire_in: 1 week
  only:
    refs:
      - main
      - develop
      - merge_requests
    changes:
      - "**/*.R"
      - "DESCRIPTION"
      - "tests/**/*"
      - ".gitlab-ci.yml"

# Test jobs for different R versions and platforms
test:r-release-ubuntu:
  <<: *test_template
  image: rocker/r-ver:latest
  variables:
    R_VERSION: "release"
    PLATFORM: "ubuntu-latest"

test:r-devel-ubuntu:
  <<: *test_template
  image: rocker/r-devel:latest
  variables:
    R_VERSION: "devel"
    PLATFORM: "ubuntu-latest"
  allow_failure: false

test:r-oldrel-ubuntu:
  <<: *test_template
  image: rocker/r-ver:4.4.0  # Updated to meet R >= 4.4.0 requirement
  variables:
    R_VERSION: "4.4.0"
    PLATFORM: "ubuntu-latest"

# macOS test jobs
test:r-release-macos:
  <<: *r_base
  <<: *r_cache
  stage: test
  tags:
    - macos
  script:
    # Check R version and update if needed
    - |
      echo "Current R version:"
      R --version
      # Ensure we're using a compatible R version
      if command -v brew >/dev/null 2>&1; then
        echo "Updating R via Homebrew..."
        brew install --cask r || brew upgrade --cask r || true
      fi
    # Install system dependencies for macOS
    - brew install pandoc || true
    # Set R options to handle warnings as errors properly
    - |
      R -e "
      options(warn = 1)  # Don't convert warnings to errors for package installation
      cat('R version:', R.version.string, '\n')
      cat('Platform:', R.version\$platform, '\n')
      "
    # Install package dependencies with better error handling
    - |
      R -e "
      options(warn = 1)  # Warnings as warnings, not errors
      cat('Installing remotes and dependencies...\n')
      if (!requireNamespace('remotes', quietly = TRUE)) {
        install.packages('remotes', repos = 'https://cloud.r-project.org/')
      }
      remotes::install_deps(dependencies = TRUE, upgrade = 'always')
      "
    # Install test dependencies
    - |
      R -e "
      options(warn = 1)
      cat('Installing test dependencies...\n')
      pkgs_to_install <- c('testthat', 'rcmdcheck', 'covr', 'spelling')
      for (pkg in pkgs_to_install) {
        if (!requireNamespace(pkg, quietly = TRUE)) {
          cat('Installing', pkg, '...\n')
          install.packages(pkg, repos = 'https://cloud.r-project.org/')
        } else {
          cat(pkg, 'already installed\n')
        }
      }
      cat('All test dependencies installed successfully\n')
      "
    # Check package build
    - mkdir -p check
    - |
      R -e "
      options(warn = 1)  # Don't treat warnings as errors for rcmdcheck
      cat('Running R CMD check...\n')
      result <- rcmdcheck::rcmdcheck(args = '--no-manual', error_on = 'error')
      if (length(result\$errors) > 0 || length(result\$warnings) > 0) { 
        dir.create('check', showWarnings = FALSE)
        writeLines(c(result\$errors, result\$warnings), 'check/rcmdcheck_output.txt')
      }
      cat('R CMD check completed\n')
      "
    # Run comprehensive tests with better error handling
    - |
      R -e "
      options(warn = 1)  # Keep warnings as warnings during testing
      cat('Loading package...\n')
      devtools::load_all()
      
      tryCatch({
        cat('Running test-gwArsenic.R specifically...\n')
        if (file.exists('tests/testthat/test-gwArsenic.R')) {
          testthat::test_file('tests/testthat/test-gwArsenic.R', reporter = 'summary')
          cat('test-gwArsenic.R completed successfully!\n')
        } else {
          cat('Warning: test-gwArsenic.R not found, trying filter approach...\n')
          devtools::test(filter = 'gwArsenic', reporter = 'summary')
        }
        
        cat('Running full test suite...\n')
        # Suppress package version warnings during testing
        suppressWarnings(devtools::test(reporter = 'summary'))
        
        cat('Testing package installation...\n')
        devtools::install(quiet = FALSE)
        library(gwArsenicR)
        
        # Test main function exists
        stopifnot(exists('perform_sensitivity_analysis'))
        cat('All tests completed successfully!\n')
      }, error = function(e) {
        cat('Test failed with error:\n')
        print(e)
        quit(status = 1)
      })
      "
    # Test vignette rendering
    - |
      R -e "
      options(warn = 1)
      if (file.exists('vignettes/gwArsenicR-vignette.Rmd')) {
        cat('Testing vignette rendering...\n')
        tryCatch({
          suppressWarnings(
            rmarkdown::render('vignettes/gwArsenicR-vignette.Rmd', 
                            output_dir = tempdir())
          )
          cat('Vignette rendered successfully!\n')
        }, error = function(e) {
          cat('Vignette rendering failed:\n')
          print(e)
          quit(status = 1)
        })
      }
      "
    # Show session info
    - |
      R -e "
      options(width = 100, warn = 1)
      cat('=== Session Information ===\n')
      cat('R version:', R.version.string, '\n')
      cat('Platform:', R.version\$platform, '\n')
      pkgs <- installed.packages()[, 'Package']
      suppressWarnings(sessioninfo::session_info(pkgs, include_base = TRUE))
      "
  variables:
    R_VERSION: "release"
    PLATFORM: "macos-latest"
  artifacts:
    when: on_failure
    paths:
      - check/
    expire_in: 1 week
  allow_failure: false
  only:
    refs:
      - main
      - develop
      - merge_requests
    changes:
      - "**/*.R"
      - "**/*.Rmd"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "tests/**/*"
      - ".gitlab-ci.yml"

# Coverage job
coverage:
  <<: *r_base
  <<: *r_cache
  stage: coverage
  image: rocker/r-ver:latest
  script:
    # Install system dependencies
    - |
      apt-get update && apt-get install -y \
        libfontconfig1-dev \
        libfreetype6-dev \
        libharfbuzz-dev \
        libfribidi-dev \
        libpng-dev \
        libtiff5-dev \
        libjpeg-dev \
        pkg-config \
        cmake \
        build-essential
    # Install package dependencies first
    - R -e "install.packages(c('Amelia', 'dplyr', 'lme4', 'broom.mixed', 'mice', 'rms'), repos = 'https://cloud.r-project.org/', Ncpus = 2)"
    - R -e "remotes::install_deps(dependencies = TRUE)"
    # Install coverage dependencies explicitly
    - R -e "install.packages(c('covr', 'testthat', 'devtools'), repos = 'https://cloud.r-project.org/')"
    # Verify dependencies are available
    - |
      R -e "
      # Check if packages are available
      required_pkgs <- c('devtools', 'covr', 'testthat')
      missing <- character(0)
      
      for (pkg in required_pkgs) {
        if (!requireNamespace(pkg, quietly = TRUE)) {
          missing <- c(missing, pkg)
        } else {
          cat('✓', pkg, 'available\n')
        }
      }
      
      if (length(missing) > 0) {
        cat('Missing packages:', paste(missing, collapse = ', '), '\n')
        install.packages(missing, repos = 'https://cloud.r-project.org/')
      }
      
      # Load packages
      library(devtools)
      library(covr)
      library(testthat)
      cat('All coverage dependencies loaded successfully\n')
      "
    # Generate simplified coverage
    - |
      R -e "
      # Load package
      devtools::load_all()
      
      # Quick coverage check for gwArsenic.R
      cat('Generating coverage...\n')
      cov <- covr::package_coverage(
        path = 'R/gwArsenic.R',
        test_files = 'tests/testthat/test-gwArsenic.R',
        quiet = FALSE
      )
      
      # Calculate coverage percentage
      coverage_pct <- covr::percent_coverage(cov)
      cat(sprintf('Coverage: %.1f%%\n', coverage_pct))
      
      # Create coverage directory and save results
      dir.create('coverage', showWarnings = FALSE)
      
      # Generate simple HTML report
      tryCatch({
        covr::report(cov, file = 'coverage/coverage-report.html')
        cat('Coverage report generated\n')
      }, error = function(e) {
        cat('Warning: Could not generate HTML report\n')
      })
      
      # Write coverage summary
      writeLines(
        c(
          paste('Coverage:', sprintf('%.1f%%', coverage_pct)),
          paste('Date:', Sys.Date()),
          paste('File: R/gwArsenic.R')
        ),
        'coverage/coverage-summary.txt'
      )
      
      # Quality gate
      if (coverage_pct < 65) {
        cat('❌ Coverage below 65% threshold\n')
        quit(status = 1)
      } else if (coverage_pct < 75) {
        cat('⚠️ Coverage below 75% recommended threshold\n')
      } else {
        cat('✅ Coverage meets quality standards\n')
      }
      "
  timeout: 20m
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week
  coverage: '/Coverage: \d+\.\d+%/'
  only:
    refs:
      - main
    changes:
      - "**/*.R"
      - "tests/**/*"
      - ".gitlab-ci.yml"

# Documentation validation
docs:
  <<: *r_base
  <<: *r_cache
  stage: docs
  image: rocker/r-ver:latest
  script:
    # Install system dependencies
    - |
      apt-get update && apt-get install -y \
        libfontconfig1-dev \
        libfreetype6-dev \
        libharfbuzz-dev \
        libfribidi-dev \
        libpng-dev \
        libtiff5-dev \
        libjpeg-dev \
        pkg-config \
        cmake \
        build-essential
    # Install package dependencies
    - R -e "install.packages(c('Amelia', 'dplyr', 'lme4', 'broom.mixed', 'mice', 'rms'), repos = 'https://cloud.r-project.org/', Ncpus = 2)"
    - R -e "remotes::install_deps(dependencies = TRUE, upgrade = 'always')"
    # Install documentation dependencies
    - R -e "install.packages(c('roxygen2', 'devtools'), repos = 'https://cloud.r-project.org/')"
    # Check documentation
    - |
      R -e "
      library(devtools)
      
      cat('Generating documentation...\n')
      devtools::document()
      
      # Verify no uncommitted changes to documentation
      status_output <- system('git status --porcelain', intern = TRUE)
      if (length(status_output) > 0) {
        cat('Documentation is out of date. Please run devtools::document()\n')
        cat('Changed files:\n')
        system('git status')
        system('git diff')
        quit(status = 1)
      }
      
      cat('Documentation is up to date!\n')
      "
  timeout: 15m
  only:
    refs:
      - main
      - develop
      - merge_requests
    changes:
      - "R/**/*"
      - "man/**/*"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".gitlab-ci.yml"

# pkgdown site generation and deployment
pages:
  <<: *r_base
  <<: *r_cache
  stage: deploy
  image: rocker/r-ver:latest
  script:
    # Install system dependencies
    - |
      apt-get update && apt-get install -y \
        libfontconfig1-dev \
        libfreetype6-dev \
        libharfbuzz-dev \
        libfribidi-dev \
        libpng-dev \
        libtiff5-dev \
        libjpeg-dev \
        pkg-config \
        cmake \
        build-essential
    # Install package dependencies
    - R -e "install.packages(c('Amelia', 'dplyr', 'lme4', 'broom.mixed', 'mice', 'rms'), repos = 'https://cloud.r-project.org/', Ncpus = 2)"
    - R -e "remotes::install_deps(dependencies = TRUE, upgrade = 'always')"
    # Install documentation dependencies
    - R -e "install.packages(c('pkgdown', 'devtools', 'rmarkdown', 'knitr'), repos = 'https://cloud.r-project.org/')"
    # Verify and build site
    - |
      R -e "
      # Load packages
      library(pkgdown)
      library(devtools)
      
      # Build site
      pkgdown::build_site(dest_dir = 'public', new_process = TRUE, install = TRUE)
      "
  timeout: 20m
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    refs:
      - main
  needs:
    - job: test:r-release-ubuntu
      optional: true
    - job: docs
      optional: true

# Release job (optional - runs on tags)
release:
  <<: *r_base
  stage: deploy
  image: rocker/r-ver:latest
  script:
    # Install dependencies
    - R -e "remotes::install_deps(dependencies = TRUE, upgrade = 'always')"
    - R -e "install.packages(c('devtools', 'pkgbuild'))"
    # Build package
    - R -e "devtools::build()"
    # Create source package
    - R -e "pkgbuild::build(dest_path = '.', binary = FALSE)"
  artifacts:
    paths:
      - "*.tar.gz"
    expire_in: 1 year
  only:
    - tags
  except:
    - branches

# Security scan (optional)
security_scan:
  stage: test
  image: rocker/r-ver:latest
  script:
    - R -e "if (!requireNamespace('oysteR', quietly = TRUE)) install.packages('oysteR')"
    - R -e "oysteR::audit_installed_r_pkgs()"
  allow_failure: true
  only:
    refs:
      - main
      - develop
    changes:
      - "DESCRIPTION"
      - ".gitlab-ci.yml"
